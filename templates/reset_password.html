<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="login-box">
        <h1>TrustVault</h1>
        <p>Create a new password</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="password" name="password" placeholder="New Password" minlength="8" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" minlength="8" required>
            <button type="submit">Reset Password</button>
        </form>
    </div>
</div>
</body>
</html>
